about.title=About
about.heading=About the workshop
about.subheading=Independent multi-brand service centre in Sofia, operating since 2004.
about.what.title=What we do
about.what.text=Pistonworks is a six-bay workshop handling diagnostics, engine and transmission work, suspension, brakes, electrical faults and bodywork. Every job is written up as a repair order, split into individual service tasks, and priced from the mechanic's hourly rate.
about.parts.title=How parts are handled
about.parts.text=Our warehouse is managed as a separate system. When a mechanic adds parts to a job the stock is reserved rather than sold, so the same alternator cannot be promised to two cars at once. Reservations are only converted into a sale when the job is completed, and are returned to stock automatically if the job is cancelled.
about.hours.title=Opening hours
about.hours.text=Monday to Friday, 08:00-18:00. Saturday, 09:00-14:00. Closed on Sundays and public holidays.
about.find.title=Find us
about.find.text=14 Iskarsko Shose, Sofia 1592, Bulgaria - +359 2 970 4400

