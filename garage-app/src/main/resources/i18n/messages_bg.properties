about.title=За нас
about.heading=За сервиза
about.subheading=Независим мултимарков сервиз в София, работещ от 2004 година.
about.what.title=С какво се занимаваме
about.what.text=Пистънуъркс е сервиз с шест канала, който извършва диагностика, ремонт на двигатели и скоростни кутии, окачване, спирачки, електрически неизправности и тенекеджийски услуги. Всяка задача се описва като ремонтна поръчка, разделя се на отделни операции и се остойностява по часовата ставка на механика.
about.parts.title=Как работим с частите
about.parts.text=Складът се управлява от отделна система. Когато механик добави части към поръчка, наличността се резервира, а не се продава, така че един и същ алтернатор не може да бъде обещан на две коли. Резервациите се превръщат в продажба само след приключване на ремонта и се връщат в склада автоматично при отказ.
about.hours.title=Работно време
about.hours.text=Понеделник до петък, 08:00-18:00. Събота, 09:00-14:00. Затворено в неделя и на официални празници.
about.find.title=Къде сме
about.find.text=Искърско шосе 14, София 1592, България - +359 2 970 4400

