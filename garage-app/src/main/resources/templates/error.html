<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="card status-page">
        <div class="status-code" th:text="${status} ?: 500">500</div>
        <h1 th:text="${reason} ?: 'Unexpected error'">Unexpected error</h1>
        <p class="hint" th:text="${message} ?: 'The request could not be completed.'">
            The request could not be completed.</p>
        <div class="actions" style="justify-content: center;">
            <a class="btn" th:href="@{/}">Back to home</a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
