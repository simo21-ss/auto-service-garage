<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit profile')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="card card-narrow">
        <h1>Edit profile</h1>
        <p class="hint">Your username and role cannot be changed here.</p>

        <form th:action="@{/profile}" th:object="${profileRequest}" method="post">
            <input type="hidden" name="_method" value="put">

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'invalid'">
                <span class="error" th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">error</span>
            </div>
            <div class="field">
                <label for="firstName">First name</label>
                <input type="text" id="firstName" th:field="*{firstName}"
                       th:classappend="${#fields.hasErrors('firstName')} ? 'invalid'">
                <span class="error" th:if="${#fields.hasErrors('firstName')}"
                      th:errors="*{firstName}">error</span>
            </div>
            <div class="field">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" th:field="*{lastName}"
                       th:classappend="${#fields.hasErrors('lastName')} ? 'invalid'">
                <span class="error" th:if="${#fields.hasErrors('lastName')}"
                      th:errors="*{lastName}">error</span>
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input type="text" id="phone" th:field="*{phone}"
                       th:classappend="${#fields.hasErrors('phone')} ? 'invalid'">
                <span class="error" th:if="${#fields.hasErrors('phone')}"
                      th:errors="*{phone}">error</span>
            </div>

            <div class="actions">
                <button type="submit" class="btn">Save changes</button>
                <a class="btn btn-ghost" th:href="@{/profile}">Cancel</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
