<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{profile.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-head">
        <div>
            <h1 th:text="#{profile.heading}">My profile</h1>
            <p th:text="#{profile.subheading}">Your contact details.</p>
        </div>
        <a class="btn" th:href="@{/profile/edit}" th:text="#{profile.edit}">Edit profile</a>
    </div>

    <section class="card">
        <dl class="dl">
            <dt th:text="#{profile.username}">Username</dt>
            <dd th:text="${user.username}">username</dd>

            <dt th:text="#{profile.fullName}">Full name</dt>
            <dd th:text="|${user.firstName} ${user.lastName}|">name</dd>

            <dt th:text="#{profile.email}">Email</dt>
            <dd th:text="${user.email}">email</dd>

            <dt th:text="#{profile.phone}">Phone</dt>
            <dd th:text="${#strings.isEmpty(user.phone)} ? #{profile.phone.missing} : ${user.phone}">phone</dd>

            <dt th:text="#{profile.role}">Role</dt>
            <dd>
                <span class="tag"
                      th:classappend="'tag-' + ${#strings.toLowerCase(user.role.name)}"
                      th:text="${user.role.name}">ROLE</span>
            </dd>

            <dt th:text="#{profile.permissions}">Permissions</dt>
            <dd>
                <span class="tag" style="margin-right: 6px;"
                      th:each="permission : ${user.role.permissions}"
                      th:text="${permission.name}">PERMISSION</span>
            </dd>

            <dt th:text="#{profile.memberSince}">Member since</dt>
            <dd th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">date</dd>
        </dl>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
