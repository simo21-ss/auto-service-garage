<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{denied.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="card status-page">
        <div class="status-code">403</div>
        <h1 th:text="#{denied.heading}">Access denied</h1>
        <p class="hint" th:text="#{denied.text}">You do not have permission.</p>
        <div class="actions" style="justify-content: center;">
            <a class="btn" th:href="@{/}" th:text="#{error.back}">Back to home</a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
