<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access denied')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="card status-page">
        <div class="status-code">403</div>
        <h1>Access denied</h1>
        <p class="hint">Your account does not have permission to open this page. If you believe this
            is a mistake, ask an administrator to review your role.</p>
        <div class="actions" style="justify-content: center;">
            <a class="btn" th:href="@{/}">Back to home</a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
