<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="card card-narrow">
        <h1>Sign in</h1>
        <p class="hint">Use your Pistonworks account to manage your vehicles and repairs.</p>

        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="alert alert-error" th:if="${param.error}">
            Wrong username or password, or the account has been deactivated.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            You have been signed out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <div class="actions">
                <button type="submit" class="btn">Sign in</button>
                <a class="btn btn-ghost" th:href="@{/register}">Create an account</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
