services:

  garage-db:
    image: postgres:16-alpine
    container_name: garage-db
    environment:
      POSTGRES_DB: garage
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage
    ports:
      - "${GARAGE_DB_PORT:-5433}:5432"
    volumes:
      - garage-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage -d garage"]
      interval: 5s
      timeout: 5s
      retries: 10

  parts-db:
    image: postgres:16-alpine
    container_name: parts-db
    environment:
      POSTGRES_DB: parts
      POSTGRES_USER: parts
      POSTGRES_PASSWORD: parts
    ports:
      - "${PARTS_DB_PORT:-5434}:5432"
    volumes:
      - parts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parts -d parts"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    container_name: garage-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ledger-db:
    image: mongo:7
    container_name: parts-ledger-db
    environment:
      MONGO_INITDB_DATABASE: partsledger
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ledger-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  parts-svc:
    build: ./parts-svc
    container_name: parts-svc
    depends_on:
      parts-db:
        condition: service_healthy
      ledger-db:
        condition: service_started
      cache:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      PARTS_DB_HOST: parts-db
      PARTS_DB_PORT: 5432
      MONGO_URI: mongodb://ledger-db:27017/partsledger
      REDIS_HOST: cache
      REDIS_PORT: 6379
    ports:
      - "${PARTS_APP_PORT:-8081}:8081"

  garage-app:
    build: ./garage-app
    container_name: garage-app
    depends_on:
      garage-db:
        condition: service_healthy
      cache:
        condition: service_healthy
      parts-svc:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      GARAGE_DB_HOST: garage-db
      GARAGE_DB_PORT: 5432
      REDIS_HOST: cache
      REDIS_PORT: 6379
      PARTS_SERVICE_URL: http://parts-svc:8081
    ports:
      - "${GARAGE_APP_PORT:-8080}:8080"

volumes:
  garage-db-data:
  parts-db-data:
  ledger-db-data:
