server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: parts-svc

  datasource:
    url: jdbc:postgresql://${PARTS_DB_HOST:localhost}:${PARTS_DB_PORT:5434}/parts
    username: ${PARTS_DB_USER:parts}
    password: ${PARTS_DB_PASSWORD:parts}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/partsledger}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

parts:
  jobs:
    auto-reorder-cron: "0 0 2 * * *"
    expiry-initial-delay-ms: 30000
    expiry-interval-ms: 600000
    reservation-ttl-hours: 48
  security:
    service-token:
      secret: ${SERVICE_TOKEN_SECRET:0f2b7c1a9d4e6f83b5c07a1e2d9f4c68a3b5d7e91c02f4a6b8d0e2f4a6c8b1d3}
      issuer: garage-app

logging:
  level:
    bg.softuni.partssvc: INFO
